<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aranya report</title>
<style>
  :root {
    --agree:#2e7d32; --single:#8a8a8a; --spread:#e08a00; --disagree:#c62828;
    --no_data:#b5b5b5; --error:#d81b60; --skipped:#6f6f6f; --absent:#dcdcdc;
    --bg:#11151c; --panel:#1b2129; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2b333d;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--ink); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:5; }
  h1 { font-size:15px; margin:0 0 8px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls label { color:var(--muted); }
  select,input { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                 border-radius:4px; padding:3px 6px; font:inherit; }
  nav { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--muted); border:1px solid var(--line);
               border-radius:5px; padding:4px 10px; cursor:pointer; font:inherit; }
  nav button.active { color:var(--ink); border-color:#3d7bd6; }
  main { padding:14px 18px 60px; }
  section { display:none; } section.active { display:block; }
  .legend { color:var(--muted); margin:6px 0 14px; }
  .chip { display:inline-block; padding:0 6px; border-radius:3px; color:#0c0f14; font-weight:700; }
  .card { border:1px solid var(--line); border-radius:6px; margin:0 0 10px; background:var(--panel); }
  .card > summary { cursor:pointer; padding:8px 10px; display:flex; gap:10px; align-items:baseline; }
  .card > summary .name { font-weight:700; }
  .card .body { padding:0 10px 10px; border-top:1px solid var(--line); }
  table { border-collapse:collapse; }
  .grid td, .grid th { width:18px; height:18px; text-align:center; font-size:12px; padding:0; }
  .grid th { color:var(--muted); font-weight:400; }
  .grid th.rowhead { text-align:right; padding-right:8px; width:auto; white-space:nowrap; }
  .grid td.cell { border:1px solid var(--line); cursor:pointer; }
  .mono { white-space:pre-wrap; word-break:break-word; }
  .muted { color:var(--muted); }
  .bar { height:10px; border-radius:2px; }
  .bars { display:grid; grid-template-columns: max-content 1fr; gap:4px 10px; align-items:center; }
  .detail { margin:10px 0 24px; padding:10px; border:1px solid var(--line); border-radius:6px;
            background:var(--bg); }
  code { background:#0c0f14; padding:1px 5px; border-radius:3px; }
  .geo { background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .kv { margin:2px 0; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
</style>
</head>
<body>
<header>
  <h1>aranya report <span class="muted" id="meta"></span></h1>
  <div class="controls">
    <label for="f-ip">ip</label><select id="f-ip"></select>
    <label for="f-q">filter</label><input id="f-q" placeholder="topic/key/source/value">
    <label for="f-state">state</label>
    <select id="f-state">
      <option value="">all</option>
      <option value="agree">agree</option>
      <option value="single">single</option>
      <option value="spread">spread</option>
      <option value="disagree">disagree</option>
      <option value="dissent">dissent</option>
      <option value="multi">multi</option>
      <option value="no_data">no_data</option>
      <option value="error">error</option>
      <option value="skipped">skipped</option>
      <option value="absent">absent</option>
    </select>
    <span class="muted" id="count"></span>
  </div>
  <nav>
    <button data-tab="claims" class="active">claims</button>
    <button data-tab="heatmap">source heatmap</button>
    <button data-tab="overview">overview</button>
    <button data-tab="profile">agreement profile</button>
    <button data-tab="geo">geo</button>
  </nav>
</header>
<main>
  <div class="legend" id="legend"></div>
  <div id="detail" class="detail" hidden></div>
  <section id="tab-claims" class="active"></section>
  <section id="tab-heatmap"></section>
  <section id="tab-overview"></section>
  <section id="tab-profile"></section>
  <section id="tab-geo"></section>
</main>
<script id="aranya-data" type="application/json">/*__ARANYA_DATA__*/null</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("aranya-data").textContent || "null");
const COLORS = {agree:"#2e7d32",single:"#8a8a8a",spread:"#e08a00",disagree:"#c62828",
  dissent:"#c62828",multi:"#e08a00",no_data:"#b5b5b5",error:"#d81b60",skipped:"#6f6f6f",absent:"#dcdcdc"};
const GLYPH = {agree:"·",single:"o",spread:"+",disagree:"#",dissent:"x",multi:"~",
  no_data:"-",error:"!",skipped:"/",absent:" "};
const STATE_LIST = ["agree","single","spread","disagree","dissent","multi","no_data","error","skipped","absent"];

function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function chip(state, text){
  const c = el("span","chip", text || state);
  c.style.background = COLORS[state] || "#888";
  return c;
}
const claimKey = c => c.topic + "." + c.key;
const stateIndex = {};
for (const s of (DATA.states||[])) stateIndex[s.ip+"|"+s.topic+"."+s.key+"|"+s.source] = s.state;

function currentFilters(){
  const p = new URLSearchParams(location.hash.replace(/^#/,""));
  return {ip:p.get("ip")||"", q:p.get("q")||"", state:p.get("state")||"",
          tab:p.get("tab")||"claims"};
}
function writeFilters(f){
  const p = new URLSearchParams();
  for (const k of ["ip","q","state","tab"]) if (f[k]) p.set(k,f[k]);
  location.hash = p.toString();
}
function selectedIP(){
  const f = currentFilters();
  return DATA.ips.includes(f.ip) ? f.ip : DATA.ips[0];
}
function claimMatches(c, f){
  if (f.state){
    if (["agree","single","spread","disagree"].includes(f.state)){
      if (c.verdict !== f.state) return false;
    } else if (["dissent","multi","no_data","error","skipped","absent"].includes(f.state)){
      const any = (DATA.states||[]).some(s => s.ip===c.ip && s.topic===c.topic && s.key===c.key && s.state===f.state);
      if (!any) return false;
    }
  }
  if (f.q){
    const needle = f.q.toLowerCase();
    const blob = (c.topic+"."+c.key+" "+c.consensus+" "+c.labels.map(l=>l.label).join(" ")).toLowerCase();
    if (!blob.includes(needle)) return false;
  }
  return true;
}
function sourceInFilters(name, f){
  return !f.q || name.toLowerCase().includes(f.q.toLowerCase());
}
function claimList(ip, f){
  return DATA.claims.filter(c => c.ip===ip && claimMatches(c,f));
}

function showDetail(claim, source){
  const box = document.getElementById("detail");
  box.hidden = false;
  box.replaceChildren();
  box.append(el("div","", claimKey(claim)+"  ["+claim.verdict+"]  consensus: "+claim.consensus));
  box.append(el("div","muted", claim.n_sources+" source(s), "+claim.n_upstreams+" upstream(s); verdict computed over upstreams"));
  for (const lab of claim.labels){
    const row = el("div","kv");
    row.append(el("span","", "• "+lab.label+"  "));
    row.append(el("span","muted", "["+lab.sources.join(", ")+"]  upstreams: "+lab.upstreams.join(", ")));
    box.append(row);
  }
  if (claim.multi.length) box.append(el("div","muted","sets: "+claim.multi.join(", ")));
  const obs = (DATA.observations||[]).filter(o => o.ip===claim.ip && o.topic===claim.topic && o.key===claim.key && (!source || o.source===source));
  if (obs.length){
    box.append(el("div","muted","\nobservations:"));
    for (const o of obs) box.append(el("div","mono","  "+o.source+"  "+JSON.stringify(o.value)));
  } else {
    box.append(el("div","muted","\n(no embedded observations — re-export with --with-observations)"));
  }
  const fetchIds = new Set(claim.sources.map(s => (DATA.fetches.find(f=>f.ip===claim.ip&&f.source===s)||{}).id).filter(Boolean));
  for (const id of fetchIds) box.append(el("div","mono","$ python3 aranya.py --show-fetch "+id));
  box.append(el("button","", "close"));
  box.lastChild.addEventListener("click", ()=>{ box.hidden=true; });
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function renderClaims(f){
  const host = document.getElementById("tab-claims");
  host.replaceChildren();
  const ip = selectedIP();
  if (!ip){ host.append(el("p","muted","no data")); return; }
  const list = claimList(ip, f);
  host.append(el("p","muted", list.length+" claim(s) for "+ip+"  (* = source reports a set)"));
  for (const c of list){
    const details = el("details","card");
    const summary = el("summary");
    summary.append(el("span","name", claimKey(c)));
    summary.append(chip(c.verdict));
    summary.append(el("span","muted", c.n_sources+" src / "+c.n_upstreams+" up"));
    details.append(summary);
    const body = el("div","body");
    body.append(el("div","kv", "consensus: "+c.consensus));
    for (const lab of c.labels){
      const row = el("div","kv");
      row.append(el("span","", "• "+lab.label+"  "));
      row.append(el("span","muted", lab.sources.join(", ") + (lab.upstreams.length<c.sources.length ? "  ("+lab.upstreams.length+" upstreams)" : "")));
      body.append(row);
    }
    for (const s of c.multi){
      body.append(el("div","kv","~ "+s+"*  "+(c.counts[s]||0)+" values: "+(c.source_labels[s]||[]).slice(0,3).join(", ")));
    }
    const button = el("button","", "details / provenance");
    button.addEventListener("click", ()=>showDetail(c));
    body.append(button);
    details.append(body);
    host.append(details);
  }
}

function renderHeatmap(f){
  const host = document.getElementById("tab-heatmap");
  host.replaceChildren();
  const ip = selectedIP();
  const claims = claimList(ip, f);
  const sources = DATA.sources.filter(s => sourceInFilters(s.id, f));
  host.append(el("p","muted","rows = source, cols = claim; state per cell ("+ip+")"));
  const table = el("table","grid");
  const head = el("tr");
  head.append(el("th",""));
  for (const c of claims) head.append(el("th","", claimKey(c).replace(/\./g,"\u200b.")));
  table.append(head);
  for (const src of sources){
    const tr = el("tr");
    tr.append(el("th","rowhead", src.id));
    for (const c of claims){
      const td = el("td","cell");
      const state = stateIndex[ip+"|"+claimKey(c)+"|"+src.id] || "absent";
      td.textContent = GLYPH[state];
      td.style.color = state==="absent" ? "#555" : "#0c0f14";
      td.style.background = COLORS[state] || "#888";
      td.title = src.id+" · "+claimKey(c)+" · "+state;
      td.addEventListener("click", ()=>showDetail(c, src.id));
      tr.append(td);
    }
    table.append(tr);
  }
  host.append(table);
  const legend = el("p","legend");
  for (const st of STATE_LIST){ const s=el("span",""); s.append(chip(st)); legend.append(s, document.createTextNode(" "+st+"  ")); }
  host.append(legend);
}

function renderOverview(f){
  const host = document.getElementById("tab-overview");
  host.replaceChildren();
  const claims = [];
  const seen = new Set();
  for (const c of DATA.claims){ const k=claimKey(c); if(!seen.has(k)){seen.add(k); claims.push(k);} }
  claims.sort();
  const ipSet = DATA.ips;
  host.append(el("p","muted","rows = IP, cols = claim; colour = verdict"));
  const table = el("table","grid");
  const head = el("tr"); head.append(el("th",""));
  for (const k of claims) head.append(el("th","", k.replace(/\./g,"\u200b.")));
  table.append(head);
  const byKey = {};
  for (const c of DATA.claims) byKey[c.ip+"|"+claimKey(c)] = c;
  for (const ip of ipSet){
    const tr = el("tr"); tr.append(el("th","rowhead", ip));
    for (const k of claims){
      const td = el("td","cell");
      const c = byKey[ip+"|"+k];
      const state = c ? c.verdict : "absent";
      td.textContent = GLYPH[state];
      td.style.background = COLORS[state] || "#888";
      td.style.color = state==="absent" ? "#555" : "#0c0f14";
      if (c) td.addEventListener("click", ()=>showDetail(c));
      tr.append(td);
    }
    table.append(tr);
  }
  host.append(table);
}

function renderProfile(f){
  const host = document.getElementById("tab-profile");
  host.replaceChildren();
  host.append(el("p","muted","agreement profile: conformity with each cell's consensus, not accuracy. A dissenter may be correct."));
  const rows = DATA.agreement_profile.filter(r => sourceInFilters(r.source, f));
  const max = Math.max(1, ...rows.map(r=>r.cells));
  for (const r of rows){
    const wrap = el("div");
    const line = el("div","muted", r.source+"  ("+r.cells+" cells)" + (f.q?"":"" ));
    wrap.append(line);
    const bars = el("div","bars");
    for (const key of ["agree","dissent","multi","single"]){
      bars.append(el("div","muted", key));
      const track = el("div"); track.style.width = "100%";
      const bar = el("div","bar");
      bar.style.background = COLORS[key];
      bar.style.width = Math.round(100*r[key]/max)+"%";
      bar.title = key+": "+r[key];
      track.append(bar); bars.append(track);
    }
    wrap.append(bars);
    wrap.style.margin = "0 0 10px";
    host.append(wrap);
  }
}

function renderGeo(f){
  const host = document.getElementById("tab-geo");
  host.replaceChildren();
  host.append(el("p","muted","equirectangular scatter of location claims; graticule every 30°, antimeridian twins drawn at both edges."));
  const W=900,H=450;
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("width","100%"); svg.setAttribute("class","geo");
  const x=lon=>(lon+180)/360*W, y=lat=>(90-lat)/180*H;
  for (let lon=-180; lon<=180; lon+=30){
    const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",x(lon)); l.setAttribute("y1",0); l.setAttribute("x2",x(lon)); l.setAttribute("y2",H);
    l.setAttribute("stroke","#2b333d"); svg.append(l);
  }
  for (let lat=-90; lat<=90; lat+=30){
    const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",0); l.setAttribute("y1",y(lat)); l.setAttribute("x2",W); l.setAttribute("y2",y(lat));
    l.setAttribute("stroke","#2b333d"); svg.append(l);
  }
  const ip = selectedIP();
  const points = DATA.locations.filter(p => (f.q? p.source.toLowerCase().includes(f.q.toLowerCase()): true));
  const palette = ["#4fc3f7","#ffb74d","#81c784","#e57373","#ba68c8","#fff176"];
  const ipList = DATA.ips;
  for (const p of points){
    if (p.latitude===null || p.longitude===null || p.latitude===undefined) continue;
    const color = palette[ipList.indexOf(p.ip)%palette.length];
    for (const shift of [-360,0,360]){
      const cx = x(p.longitude+shift);
      if (cx<0 || cx>W) continue;
      const c=document.createElementNS(svgNS,"circle");
      c.setAttribute("cx",cx); c.setAttribute("cy",y(p.latitude)); c.setAttribute("r",3);
      c.setAttribute("fill",color); c.setAttribute("opacity","0.75");
      const t=document.createElementNS(svgNS,"title"); t.textContent=p.ip+" · "+p.source+" · "+p.city+", "+p.country;
      c.append(t); svg.append(c);
    }
  }
  host.append(svg);
  const legend = el("p","legend");
  for (const ipx of ipList){ const s=el("span"); const sw=el("span","swatch"); sw.style.background=palette[ipList.indexOf(ipx)%palette.length]; s.append(sw, document.createTextNode(ipx+"  ")); legend.append(s); }
  host.append(legend);
}

function renderAll(){
  const f = currentFilters();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab===f.tab));
  for (const sec of document.querySelectorAll("section")) sec.classList.remove("active");
  const active = document.getElementById("tab-"+f.tab); (active||document.getElementById("tab-claims")).classList.add("active");
  document.getElementById("f-q").value = f.q;
  document.getElementById("f-state").value = f.state;
  document.getElementById("f-ip").value = selectedIP();
  renderClaims(f); renderHeatmap(f); renderOverview(f); renderProfile(f); renderGeo(f);
}

function init(){
  const meta = document.getElementById("meta");
  if (!DATA){ meta.textContent = "— no embedded data (open an exported report)"; document.getElementById("legend").textContent=""; return; }
  meta.textContent = "· schema v"+DATA.schema_version+" · "+DATA.ips.length+" ip(s) · "
    + DATA.claims.length+" claims · latest "+(DATA.latest_observation||"?");
  document.getElementById("count").textContent = DATA.ips.length+" ips";
  const ipSel = document.getElementById("f-ip");
  for (const ip of DATA.ips) ipSel.append(el("option","",ip));
  ipSel.addEventListener("change", e => { const f=currentFilters(); f.ip=e.target.value; writeFilters(f); });
  document.getElementById("f-q").addEventListener("input", e => { const f=currentFilters(); f.q=e.target.value; writeFilters(f); });
  document.getElementById("f-state").addEventListener("change", e => { const f=currentFilters(); f.state=e.target.value; writeFilters(f); });
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", ()=>{ const f=currentFilters(); f.tab=b.dataset.tab; writeFilters(f); }));
  window.addEventListener("hashchange", renderAll);
  renderAll();
}
init();
</script>
</body>
</html>
