[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aranya"
version = "0.1.0"
description = "Evidence layer over public internet-infrastructure data"
requires-python = ">=3.10"
dependencies = ["networkx"]

[project.optional-dependencies]
mmdb = ["maxminddb"]

[project.scripts]
aranya = "aranya:main"

[tool.setuptools]
py-modules = [
    "aranya",
]
packages = ["registry", "paths", "report", "source"]
