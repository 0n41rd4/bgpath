<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aranya report</title>
<style>
  :root {
    --agree:#1b5e20; --single:#5b6470; --spread:#b26a00; --disagree:#b71c1c;
    --no_data:#5b6470; --error:#880e4f; --skipped:#4a4a4a; --absent:#3a424c; --absent-tint:#20262e;
    --bg:#11151c; --panel:#1b2129; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2b333d; --accent:#3d7bd6;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--ink); }
  button { font:inherit; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:10; }
  h1 { font-size:15px; margin:0 0 8px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls label { color:var(--muted); }
  .controls .ctl { display:flex; gap:6px; align-items:center; }
  .controls .ctl.disabled { opacity:.35; pointer-events:none; }
  select,input { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                 border-radius:4px; padding:3px 6px; font:inherit; }
  nav { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--muted); border:1px solid var(--line);
               border-radius:5px; padding:4px 10px; cursor:pointer; }
  nav button[aria-selected="true"] { color:var(--ink); border-color:var(--accent); }
  main { padding:12px 18px 60px; }
  section { display:none; } section.active { display:block; }
  .strip { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 12px; }
  .strip button { border:1px solid var(--line); border-radius:4px; padding:2px 9px; cursor:pointer;
                  background:var(--panel); color:var(--ink); }
  .strip button[aria-pressed="true"] { border-color:var(--accent); }
  .strip .muted { margin-left:6px; }
  .glyph { font-weight:700; }
  .chip { display:inline-block; padding:0 6px; border-radius:3px; color:#fff; font-weight:700; }
  .val { font-weight:700; }
  .legend { color:var(--muted); margin:8px 0 14px; }
  .legend .item { margin-right:14px; white-space:nowrap; }
  .swatch { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px;
            vertical-align:middle; color:#fff; text-align:center; line-height:11px; font-size:9px; }
  .group { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
           margin:16px 0 7px; font-weight:600; }
  .card { border:1px solid var(--line); border-radius:6px; margin:0 0 10px; background:var(--panel); }
  .card > summary { cursor:pointer; padding:8px 10px; display:flex; gap:10px; align-items:baseline; }
  .card > summary .name { font-weight:700; min-width:20ch; }
  .card > summary .cons { flex:1; }
  .card .body { padding:8px 10px 12px; border-top:1px solid var(--line); }
  .labelrow { padding:3px 8px; border-left:3px solid transparent; border-radius:3px; }
  .labelrow.top { border-left-color:var(--agree); background:rgba(27,94,32,.22); }
  .wrap { overflow:auto; max-height:72vh; border:1px solid var(--line); border-radius:6px; }
  table.matrix { border-collapse:separate; border-spacing:0; font-size:12px; }
  table.matrix th, table.matrix td { padding:2px 7px; border-bottom:1px solid var(--line); }
  table.matrix th { color:var(--muted); font-weight:400; text-align:left; position:sticky; top:0;
                    background:var(--bg); z-index:2; }
  table.matrix th.claimcol, table.matrix td.claimcol { position:sticky; left:0; background:var(--panel);
                    z-index:3; white-space:nowrap; padding-right:10px; }
  table.matrix th.claimcol { z-index:4; }
  table.matrix th.rot { height:96px; vertical-align:bottom; }
  table.matrix th.rot span { writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; }
  td.cell { border-left:3px solid transparent; max-width:190px; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  td.cell:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  td.gap { text-align:center; color:var(--muted); }
  .muted { color:var(--muted); }
  .routing { color:var(--accent); font-weight:600; font-size:12.5px; margin:2px 0 6px; }
  code { background:#0c0f14; padding:1px 5px; border-radius:3px; }
  #drawer { position:fixed; top:0; right:0; width:min(560px,90vw); height:100%; overflow:auto;
            background:var(--panel); border-left:1px solid var(--line); padding:14px 16px;
            box-shadow:-8px 0 24px rgba(0,0,0,.4); display:none; z-index:20; }
  #drawer.open { display:block; }
  #drawer h2 { font-size:13px; margin:0 0 8px; }
  #drawer .desc { margin:0 0 8px; }
  #drawer pre { white-space:pre-wrap; word-break:break-word; background:#0c0f14; padding:8px;
                border-radius:4px; margin:4px 0; }
  .obs { border:1px solid var(--line); border-radius:4px; margin:6px 0; }
  .obs > summary { cursor:pointer; padding:5px 7px; }
  .obsbody { padding:0 7px 7px; }
  .obs pre { max-height:240px; overflow:auto; }
  details.raw { margin-top:4px; }
  details.raw > summary { color:var(--muted); cursor:pointer; }
  details.raw pre { max-height:360px; overflow:auto; }
  #drawer .close { position:absolute; top:10px; right:12px; background:var(--panel); color:var(--ink);
                   border:1px solid var(--line); border-radius:4px; padding:2px 9px; cursor:pointer; }
  .bar-track { position:relative; height:12px; background:#0c0f14; border-radius:2px; overflow:hidden; }
  .bar-seg { position:absolute; top:0; height:12px; }
  .stack { display:grid; grid-template-columns: minmax(14ch,max-content) 1fr max-content; gap:4px 10px;
           align-items:center; }
  .dim { opacity:.5; }
  .geo { background:#0d1b2a; border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>aranya report <span class="muted" id="meta"></span></h1>
  <div class="controls">
    <div class="ctl" id="ctl-ip"><label for="f-ip">ip</label>
      <select id="f-ip"></select></div>
    <div class="ctl" id="ctl-q"><label for="f-q">filter</label>
      <input id="f-q" placeholder="label/value/source"></div>
    <div class="ctl" id="ctl-state"><label for="f-state">state</label>
      <select id="f-state">
        <option value="">all</option>
        <option value="agree">agree</option><option value="single">single</option>
        <option value="spread">set</option><option value="disagree">disagree</option>
        <option value="dissent">dissent</option><option value="multi">multi</option>
        <option value="no_data">no_data</option><option value="error">error</option>
        <option value="skipped">skipped</option><option value="absent">absent</option>
      </select></div>
    <span class="muted" id="count"></span>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="claims">claims</button>
    <button role="tab" data-tab="matrix">source values</button>
    <button role="tab" data-tab="overview">overview</button>
    <button role="tab" data-tab="profile">agreement profile</button>
    <button role="tab" data-tab="geo">geo</button>
  </nav>
</header>
<main>
  <div class="strip" id="strip"></div>
  <section id="tab-claims" class="active"></section>
  <section id="tab-matrix"></section>
  <section id="tab-overview"></section>
  <section id="tab-profile"></section>
  <section id="tab-geo"></section>
</main>
<div id="drawer" role="dialog" aria-modal="false" aria-label="provenance"></div>
<script id="aranya-data" type="application/json">/*__ARANYA_DATA__*/null</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("aranya-data").textContent || "null");
const LAND = /*__ARANYA_LAND__*/null;
const COLOR = {agree:"#1b5e20",single:"#5b6470",spread:"#b26a00",disagree:"#b71c1c",
  dissent:"#8e0000",multi:"#7a4a00",no_data:"#5b6470",error:"#880e4f",skipped:"#4a4a4a",absent:"#3a424c"};
const TINT = {agree:"rgba(27,94,32,.30)",single:"rgba(91,100,112,.22)",spread:"rgba(178,106,0,.30)",
  disagree:"rgba(183,28,28,.32)",dissent:"rgba(142,0,0,.34)",multi:"rgba(122,74,0,.32)",
  no_data:"rgba(91,100,112,.14)",error:"rgba(136,14,79,.34)",skipped:"rgba(74,74,74,.28)",
  absent:"transparent"};
const GLYPH = {agree:"=",single:"\u00b7",spread:"~",disagree:"\u2260",dissent:"\u00d7",
  multi:"\u2261",no_data:"?",error:"\u2717",skipped:"\u2205",absent:""};
const VERDICTS = ["agree","single","spread","disagree"];
const VLABEL = DATA.verdict_labels || {agree:"agree",single:"single",spread:"set",disagree:"disagree"};
const verdictText = v => VLABEL[v] || v;
const GROUPS = DATA.claim_groups || {core:"IP facts",routes:"BGP routes",as:"AS",identity:"Identity",latency:"Latency",other:"Other"};
const STATE_ORDER = ["agree","single","spread","disagree","dissent","multi","error","skipped","no_data","absent"];
const SEVERITY = {disagree:0, spread:1, agree:2, single:3};
const TABS = {
  claims:   {ip:true, q:true,  state:true},
  matrix:   {ip:true, q:true,  state:true},
  overview: {ip:false,q:true,  state:true},
  profile:  {ip:false,q:true,  state:false},
  geo:      {ip:true, q:true,  state:false},
};

const claimsByIp = {};
for (const c of DATA.claims) (claimsByIp[c.ip] = claimsByIp[c.ip] || []).push(c);
const claimByKey = {};
for (const c of DATA.claims) claimByKey[c.ip+"|"+c.topic+"."+c.key] = c;
const cellState = {};
const claimStates = {};
for (const s of (DATA.states||[])){
  cellState[s.ip+"|"+s.topic+"."+s.key+"|"+s.source] = s.state;
  const k = s.ip+"|"+s.topic+"."+s.key;
  claimStates[k] = claimStates[k] || {};
  claimStates[k][s.state] = (claimStates[k][s.state]||0) + 1;
}

function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls;
  if(text!==undefined) n.textContent=text; return n; }
function chip(state, text){ const c=el("span","chip", text||state); c.style.background=COLOR[state]||"#888"; return c; }
function glyph(state){ const g=el("span","glyph",GLYPH[state]); g.style.color=COLOR[state]; return g; }
function legend(states){
  const box=el("p","legend");
  for (const st of states){
    const item=el("span","item");
    const sw=el("span","swatch",GLYPH[st]); sw.style.background=COLOR[st];
    item.append(sw, document.createTextNode(" "+verdictText(st))); box.append(item);
  }
  return box;
}
const claimKey = c => c.topic + "." + c.key;  // internal identity only
const claimLabel = c => c.label || claimKey(c);
const claimHeadline = c => c.headline || c.consensus;

function filters(){
  const p=new URLSearchParams(location.hash.replace(/^#/,""));
  return {ip:p.get("ip")||"", q:p.get("q")||"", state:p.get("state")||"", tab:p.get("tab")||"claims"};
}
function setFilters(f){
  const p=new URLSearchParams();
  for (const k of ["ip","q","state","tab"]) if (f[k]) p.set(k,f[k]);
  history.replaceState(null,"","#"+p.toString());
  renderAll();
}
function selectedIP(f){ return DATA.ips.includes(f.ip) ? f.ip : DATA.ips[0]; }
function claimMatches(c, f){
  if (f.state){
    if (VERDICTS.includes(f.state)){ if (c.verdict!==f.state) return false; }
    else { const cs=claimStates[c.ip+"|"+claimKey(c)]||{}; if(!cs[f.state]) return false; }
  }
  if (f.q){
    const n=f.q.toLowerCase();
    const blob=(claimLabel(c)+" "+claimKey(c)+" "+claimHeadline(c)+" "+c.labels.map(l=>l.label).join(" ")+" "+c.sources.join(" ")).toLowerCase();
    if (!blob.includes(n)) return false;
  }
  return true;
}
function srcMatches(src, f){ return !f.q || src.id.toLowerCase().includes(f.q.toLowerCase()); }
function sortClaims(list){ return list.slice().sort((a,b)=>
  ((a.priority??99999)-(b.priority??99999)) ||
  (SEVERITY[a.verdict]-SEVERITY[b.verdict]) || claimLabel(a).localeCompare(claimLabel(b)) || claimKey(a).localeCompare(claimKey(b))); }
function scopeClaims(f, tab){
  if (tab==="claims" || tab==="matrix") return sortClaims((claimsByIp[selectedIP(f)]||[]).filter(c=>claimMatches(c,f)));
  if (tab==="overview") return sortClaims(DATA.claims.filter(c=>claimMatches(c,f)));
  return DATA.claims;
}
function cellText(c, src, state){
  if (state==="agree"||state==="single") return GLYPH.agree;
  if (state==="dissent") return (c.source_labels[src]||[])[0] || GLYPH.dissent;
  if (state==="multi") return GLYPH.multi+(c.counts[src]||0);
  return GLYPH[state];
}

function latestFetch(claim, source){
  let best=null;
  for (const f of (DATA.fetches||[])){
    if (f.ip===claim.ip && f.source===source && (!best || f.id>best.id)) best=f;
  }
  return best;
}
function valueText(value){
  if (value === null) return "null";
  return typeof value === "string" ? value : JSON.stringify(value, null, 2);
}
function openDrawer(claim, source){
  const d=document.getElementById("drawer");
  d.replaceChildren();
  const close=el("button","close","✕"); close.addEventListener("click",()=>d.classList.remove("open"));
  d.append(close);
  d.append(el("h2","", claimLabel(claim)+"  ["+verdictText(claim.verdict)+"]"));
  if (claim.description) d.append(el("div","desc",claim.description));
  d.append(el("div","muted", claim.n_sources+" source(s), "+claim.n_upstreams+" upstream(s); verdict over upstreams"));
  const cons=el("div",""); cons.append(el("span","muted","summary: "));
  cons.append(el("span","val",claimHeadline(claim))); d.append(cons);
  if (claim.explanation) d.append(el("div","muted",claim.explanation));
  for (const lab of claim.labels){
    const row=el("div",""); row.append(el("span","val",lab.label+"  "));
    row.append(el("span","muted","["+lab.sources.join(", ")+"]")); d.append(row);
  }
  for (const s of claim.multi){
    const labels=claim.source_labels[s]||[];
    d.append(el("div","muted", s+"*  "+labels.length+" values: "+labels.slice(0,8).join(", ")+(labels.length>8?"…":"")));
  }

  const observations=(DATA.observations||[]).filter(
    o=>o.ip===claim.ip && o.topic===claim.topic && o.key===claim.key
  );
  const bySource={};
  for (const o of observations) (bySource[o.source]=bySource[o.source]||[]).push(o);
  const sources=[...new Set([...(claim.sources||[]), ...Object.keys(bySource), ...(source?[source]:[])])];
  sources.sort((a,b)=> a===source ? -1 : b===source ? 1 : a.localeCompare(b));

  d.append(el("div","muted","observations:"));
  if (!observations.length) d.append(el("div","muted","(observations not embedded in this report)"));
  for (const s of sources){
    const list=bySource[s]||[];
    const box=el("details","obs");
    if (!source || s===source) box.open=true;
    const summary=el("summary","");
    summary.append(el("span","val",s+"  "));
    const state=cellState[claim.ip+"|"+claimKey(claim)+"|"+s];
    summary.append(el("span","muted",(state?state+" · ":"")+list.length+" observation(s)"));
    box.append(summary);
    const body=el("div","obsbody");
    if (list.length){
      const first=list[0];
      const meta=[first.upstream, first.evidence_class, first.observed_at].filter(Boolean).join(" · ");
      if (meta) body.append(el("div","muted",meta));
      for (const o of list){
        const pre=el("pre",""); pre.textContent=valueText(o.value); body.append(pre);
      }
    }
    const ids=[...new Set(list.map(o=>o.fetch_id).filter(id=>id!=null))];
    let fts=ids.map(id=>(DATA.fetches||[]).find(f=>f.id===id)).filter(Boolean);
    if (!fts.length){ const ft=latestFetch(claim,s); if (ft) fts=[ft]; }
    for (const ft of fts){
      const raw=el("details","raw");
      raw.append(el("summary","", "raw source · fetch "+ft.id+" · "+(ft.status==null?"?":ft.status)+(ft.error?" · "+ft.error:"")));
      const endpoint=ft.url||"(no endpoint recorded)";
      raw.append(el("div","muted", (ft.method?ft.method+" ":"")+endpoint));
      if (Object.prototype.hasOwnProperty.call(ft,"body") && ft.body !== null){
        const pre=el("pre",""); pre.textContent=String(ft.body); raw.append(pre);
      } else {
        raw.append(el("div","muted","no raw body; $ python3 aranya.py --show-fetch "+ft.id));
      }
      body.append(raw);
    }
    if (!fts.length) body.append(el("div","muted","no fetch record"));
    if (!list.length && observations.length) body.append(el("div","muted","(no embedded observations for this source)"));
    box.append(body); d.append(box);
  }
  d.classList.add("open");
}

function renderStrip(f, tab){
  const host=document.getElementById("strip"); host.replaceChildren();
  const scope=scopeClaims(f,tab);
  const vc={agree:0,single:0,spread:0,disagree:0};
  for (const c of scope) vc[c.verdict]++;
  for (const v of VERDICTS){
    const b=el("button","", vc[v]+" "+verdictText(v));
    b.setAttribute("aria-pressed", f.state===v ? "true":"false");
    b.style.borderLeft="3px solid "+COLOR[v];
    b.addEventListener("click", ()=>{ const nf=filters(); nf.state = nf.state===v ? "" : v; setFilters(nf); });
    host.append(b);
  }
  const cellTotals={error:0,skipped:0,no_data:0};
  for (const c of scope){ const cs=claimStates[c.ip+"|"+claimKey(c)]||{};
    for (const k of Object.keys(cellTotals)) cellTotals[k]+=cs[k]||0; }
  host.append(el("span","muted","· "+cellTotals.error+" error · "+cellTotals.skipped+" skipped · "+cellTotals.no_data+" no_data (cells)"));
  document.getElementById("count").textContent = scope.length+" claims";
}

function renderClaims(f){
  const host=document.getElementById("tab-claims"); host.replaceChildren();
  const ip=selectedIP(f);
  const list=scopeClaims(f,"claims");
  if (!ip){ host.append(el("p","muted","no data")); return; }
  if (!list.length){ host.append(el("p","muted","no claims match the filter")); return; }
  host.append(el("p","muted", list.length+" claim(s) for "+ip));
  const rt=(DATA.as_routing||[]).find(r=>r.ip===ip);
  if (rt){
    const bits=[];
    if (rt.announced!=null) bits.push("announces "+rt.announced+" prefixes");
    if (rt.upstream_as) bits.push("upstream AS"+rt.upstream_as);
    if (bits.length) host.append(el("p","routing", bits.join(" · ")));
    if (rt.observers&&rt.observers.length){
      host.append(el("p","muted","observed at: "+rt.observers.slice(0,8).map(o=>o.source+":"+o.location).join(" | ")));
    }
  }
  let group="";
  for (const c of list){
    const claimGroup=c.group||"other";
    if (claimGroup!==group){ group=claimGroup; host.append(el("h2","group",GROUPS[group]||group)); }
    const details=el("details","card"); const summary=el("summary");
    summary.append(el("span","name",claimLabel(c))); summary.append(chip(c.verdict, verdictText(c.verdict)));
    const cons=el("span","cons"); cons.append(el("span","val",claimHeadline(c)));
    cons.append(el("span","muted","   "+c.n_sources+" src / "+c.n_upstreams+" up"));
    summary.append(cons); details.append(summary);
    const body=el("div","body");
    const shown=c.labels.slice(0,8);
    shown.forEach((lab,i)=>{ const row=el("div",i===0?"labelrow top":"labelrow");
      row.append(el("span","val",lab.label));
      body.append(row); });
    if (c.labels.length>shown.length)
      body.append(el("div","labelrow muted","+"+(c.labels.length-shown.length)+" more values; open details / provenance"));
    const btn=el("button","","details / provenance"); btn.addEventListener("click",()=>openDrawer(c));
    body.append(btn); details.append(body); host.append(details);
  }
}

function renderMatrix(f){
  const host=document.getElementById("tab-matrix"); host.replaceChildren();
  const ip=selectedIP(f);
  const claims=scopeClaims(f,"matrix");
  const sources=DATA.sources.filter(s=>srcMatches(s,f));
  if (!claims.length || !sources.length){ host.append(el("p","muted","nothing matches the filter")); return; }
  const visibleSources=sources.filter(s=>claims.some(c=>(cellState[ip+"|"+claimKey(c)+"|"+s.id]||"absent")!=="absent"));
  const contours=claims.filter(c=>visibleSources.some(s=>(cellState[ip+"|"+claimKey(c)+"|"+s.id]||"absent")!=="absent"));
  host.append(el("p","muted","cell shows a value only when it differs from the summary ("+GLYPH.agree+" = agrees); colour = state. scroll →"));
  const wrap=el("div","wrap"); const table=el("table","matrix");
  const head=el("tr"); head.append(el("th","claimcol","claim [verdict] consensus"));
  for (const s of visibleSources) head.append(el("th","", s.id));
  table.append(head);
  for (const c of contours){
    const tr=el("tr"); tr.append(el("th","claimcol", claimLabel(c)+"  ["+verdictText(c.verdict)+"]  "+claimHeadline(c)));
    for (const s of visibleSources){
      const state=cellState[ip+"|"+claimKey(c)+"|"+s.id]||"absent";
      const td=el("td","cell"+(state in {no_data:1,error:1,skipped:1,absent:1}?" gap":""));
      td.textContent=cellText(c,s.id,state);
      td.style.borderLeftColor=COLOR[state]; td.style.background=TINT[state];
      td.title=s.id+" · "+claimLabel(c)+" · "+state+" : "+((c.source_labels[s.id]||[GLYPH[state]]).join(", "));
      td.tabIndex=0; td.setAttribute("role","button");
      td.setAttribute("aria-label", s.id+" "+claimLabel(c)+" "+state);
      td.addEventListener("click",()=>openDrawer(c,s.id));
      td.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDrawer(c,s.id);} });
      tr.append(td);
    }
    table.append(tr);
  }
  wrap.append(table); host.append(wrap); host.append(legend(STATE_ORDER));
}

function renderOverview(f){
  const host=document.getElementById("tab-overview"); host.replaceChildren();
  const claims=scopeClaims(f,"overview");
  const keys=[...new Set(claims.map(claimKey))];
  const keySev={}, keyLabel={}, keyPri={};
  for (const k of keys){ const c=DATA.claims.find(x=>claimKey(x)===k); keySev[k]=c?SEVERITY[c.verdict]:9; keyPri[k]=c?(c.priority??99999):99999; keyLabel[k]=c?claimLabel(c):k; }
  keys.sort((a,b)=> (keyPri[a]-keyPri[b]) || (keySev[a]-keySev[b]) || keyLabel[a].localeCompare(keyLabel[b]) || a.localeCompare(b));
  host.append(el("p","muted","rows = IP, cols = claim; cell = summary value; colour = verdict"));
  const wrap=el("div","wrap"); const table=el("table","matrix");
  const head=el("tr"); head.append(el("th","claimcol","ip \\ claim"));
  for (const k of keys){ const th=el("th","rot"); th.append(el("span","",keyLabel[k])); head.append(th); }
  table.append(head);
  for (const ip of DATA.ips){
    const tr=el("tr"); tr.append(el("th","claimcol",ip));
    for (const k of keys){ const c=claimByKey[ip+"|"+k]; const td=el("td","cell");
      if (c){ td.textContent=claimHeadline(c); td.style.borderLeftColor=COLOR[c.verdict]; td.style.background=TINT[c.verdict];
        td.title=ip+" · "+keyLabel[k]+" · "+verdictText(c.verdict)+" : "+claimHeadline(c); td.tabIndex=0; td.setAttribute("role","button");
        td.addEventListener("click",()=>openDrawer(c));
        td.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDrawer(c);} }); }
      else { td.className="cell gap"; }
      tr.append(td); }
    table.append(tr);
  }
  wrap.append(table); host.append(wrap); host.append(legend(VERDICTS));
}

function renderProfile(f){
  const host=document.getElementById("tab-profile"); host.replaceChildren();
  host.append(el("p","muted","agreement profile: conformity with each cell's consensus, not accuracy. A dissenter may be correct."));
  const rows=DATA.source_summary.filter(s=>!f.q||s.source.toLowerCase().includes(f.q.toLowerCase()));
  const grid=el("div","stack");
  for (const r of rows){
    const name=el("div", r.total<3?"dim":""); name.textContent=r.source+"  (n="+r.total+")";
    const track=el("div","bar-track"); let x=0;
    for (const st of STATE_ORDER){ const n=r[st]||0; if(!n) continue;
      const seg=el("div","bar-seg"); seg.style.left=x+"%"; seg.style.width=(100*n/r.total)+"%";
      seg.style.background=COLOR[st]; seg.title=st+": "+n; x+=100*n/r.total; track.append(seg); }
    const note=el("div","muted", "err "+(r.error||0)+" · skip "+(r.skipped||0)+" · nd "+(r.no_data||0));
    grid.append(name,track,note);
  }
  host.append(grid); host.append(legend(STATE_ORDER));
}

function renderGeo(f){
  const host=document.getElementById("tab-geo"); host.replaceChildren();
  host.append(el("p","muted","equirectangular scatter (coarse Natural Earth 110m outline); dots sized by how many claims land on the same point; graticule 30°; antimeridian twins."));
  const W=360,H=180, svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg"); svg.setAttribute("viewBox","0 0 360 180");
  svg.setAttribute("width","100%"); svg.setAttribute("class","geo");
  if (typeof LAND==="string" && LAND.length){ const land=document.createElementNS(svgNS,"path");
    land.setAttribute("d",LAND); land.setAttribute("fill","#20303f"); land.setAttribute("stroke","#2f4456");
    land.setAttribute("stroke-width","0.2"); svg.append(land); }
  for (let lon=-180; lon<=180; lon+=30){ const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",lon+180); l.setAttribute("y1",0); l.setAttribute("x2",lon+180); l.setAttribute("y2",180);
    l.setAttribute("stroke","#2b333d"); l.setAttribute("stroke-width","0.2"); svg.append(l); }
  for (let lat=-90; lat<=90; lat+=30){ const l=document.createElementNS(svgNS,"line");
    l.setAttribute("x1",0); l.setAttribute("y1",90-lat); l.setAttribute("x2",360); l.setAttribute("y2",90-lat);
    l.setAttribute("stroke","#2b333d"); l.setAttribute("stroke-width","0.2"); svg.append(l); }
  const ipSel = DATA.ips.includes(f.ip) ? f.ip : null;
  const palette=["#4fc3f7","#ffb74d","#81c784","#e57373","#ba68c8","#fff176"];
  const groups={};
  for (const p of DATA.locations){
    if (ipSel && p.ip!==ipSel) continue;
    if (f.q && !p.source.toLowerCase().includes(f.q.toLowerCase())) continue;
    if (p.latitude==null||p.longitude==null) continue;
    const k=p.ip+"|"+p.latitude+"|"+p.longitude; groups[k]=groups[k]||{p:p,n:0,srcs:new Set()};
    groups[k].n++; groups[k].srcs.add(p.source);
  }
  for (const g of Object.values(groups)){
    const color=palette[DATA.ips.indexOf(g.p.ip)%palette.length];
    for (const shift of [-360,0,360]){ const cx=g.p.longitude+shift+180; if(cx<0||cx>360) continue;
      const c=document.createElementNS(svgNS,"circle"); c.setAttribute("cx",cx); c.setAttribute("cy",90-g.p.latitude);
      c.setAttribute("r", Math.min(7, 1.4+Math.sqrt(g.n))); c.setAttribute("fill",color); c.setAttribute("opacity","0.8");
      const t=document.createElementNS(svgNS,"title"); t.textContent=g.p.ip+" · "+[...g.srcs].join(",")+" · "+g.p.city+", "+g.p.country+" (n="+g.n+")";
      c.append(t); svg.append(c); }
  }
  host.append(svg);
  const lg=el("p","legend");
  for (const ipx of DATA.ips){ const item=el("span","item"); const sw=el("span","swatch");
    sw.style.background=palette[DATA.ips.indexOf(ipx)%palette.length]; item.append(sw,document.createTextNode(" "+ipx)); lg.append(item); }
  host.append(lg);
  if ((DATA.latency||[]).length){
    host.append(el("p","muted","latency probes:"));
    const t=el("table","matrix"); const hd=el("tr"); for (const h of ["ip","source","city","avg_rtt","loss"]) hd.append(el("th","",h)); t.append(hd);
    for (const r of DATA.latency){ if (ipSel && r.ip!==ipSel) continue; const tr=el("tr");
      for (const v of [r.ip,r.source,r.city,r.avg_rtt,r.loss]) tr.append(el("td","",String(v))); t.append(tr); }
    host.append(t);
  }
}

const RENDERERS={claims:renderClaims, matrix:renderMatrix, overview:renderOverview, profile:renderProfile, geo:renderGeo};
function renderAll(){
  const f=filters();
  if (!RENDERERS[f.tab]) f.tab="claims";
  if (DATA.ips.length && !DATA.ips.includes(f.ip) && f.tab!=="overview") f.ip=DATA.ips[0];
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===f.tab ? "true":"false"));
  for (const sec of document.querySelectorAll("main section")) sec.classList.remove("active");
  document.getElementById("tab-"+f.tab).classList.add("active");
  const cfg=TABS[f.tab];
  for (const [name,key] of [["ctl-ip","ip"],["ctl-q","q"],["ctl-state","state"]])
    document.getElementById(name).classList.toggle("disabled", !cfg[key]);
  document.getElementById("f-ip").value=f.ip||selectedIP(f)||"";
  document.getElementById("f-q").value=f.q;
  document.getElementById("f-state").value=f.state;
  renderStrip(f,f.tab);
  RENDERERS[f.tab](f);
}
function init(){
  const meta=document.getElementById("meta");
  if (!DATA){ meta.textContent="— no embedded data (open an exported report)"; return; }
  meta.textContent="· schema v"+DATA.schema_version+" · "+DATA.ips.length+" ip(s) · "+DATA.claims.length+" claims · latest "+(DATA.latest_observation||"?");
  const ipSelect=document.getElementById("f-ip");
  for (const ip of DATA.ips) ipSelect.append(el("option","",ip));
  if (!DATA.ips.length) ipSelect.append(el("option","","no data"));
  ipSelect.addEventListener("change",e=>{ const f=filters(); f.ip=e.target.value; setFilters(f); });
  document.getElementById("f-q").addEventListener("input",e=>{ const f=filters(); f.q=e.target.value; setFilters(f); });
  document.getElementById("f-state").addEventListener("change",e=>{ const f=filters(); f.state=e.target.value; setFilters(f); });
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ const f=filters(); f.tab=b.dataset.tab; setFilters(f); }));
  window.addEventListener("hashchange",()=>renderAll());
  renderAll();
}
init();
</script>
