<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aranya · scan graph</title>
<style>
  :root { --bg:#0b1020; --panel:#141a2e; --ink:#e6ebf5; --muted:#8b96b0; --line:#26304a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; }
  header .meta { color:var(--muted); }
  .hint { color:var(--muted); }
  #wrap { display:flex; height:calc(100vh - 52px); }
  #canvas { flex:1; overflow:hidden; position:relative; cursor:grab; }
  #canvas.grabbing { cursor:grabbing; }
  svg { display:block; }
  .hop rect { stroke:#0b1020; stroke-width:1.5; rx:5; }
  .hop text { fill:#fff; font-size:11px; pointer-events:none; }
  .edge { fill:none; }
  .asbox { fill:#16a34a14; stroke:#16a34a88; stroke-width:1; }
  .machinebox { fill:none; stroke:#7c3aed; stroke-width:1.5; stroke-dasharray:5 4; }
  .boxtitle { fill:#cbd5e1; font-size:11px; }
  .boxsub { fill:#86efac; font-size:10px; }
  .ixchip rect { fill:#0ea5e9; stroke:#0b1020; stroke-width:1; rx:8; }
  .ixchip text { fill:#fff; font-size:10px; pointer-events:none; }
  .ixchip { cursor:pointer; }
  .hop .ixdot { fill:#0ea5e9; stroke:#0b1020; stroke-width:1; }
  #panel { width:380px; border-left:1px solid var(--line); background:var(--panel); padding:14px; overflow:auto; }
  #panel h2 { font-size:12px; margin:14px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  #panel h2:first-child { margin-top:0; }
  #panel .kv { margin:0 0 4px; word-break:break-word; }
  #panel .k { color:var(--muted); }
  #panel a { color:#7dd3fc; }
  #panel table { border-collapse:collapse; width:100%; }
  #panel td { padding:2px 0; vertical-align:top; }
  #panel td.k { width:96px; color:var(--muted); }
  #panel .item { border-bottom:1px solid var(--line); padding:6px 0; }
  #tooltip { position:fixed; pointer-events:none; background:#000c; border:1px solid var(--line);
             padding:4px 7px; border-radius:4px; font-size:11px; display:none; z-index:5; }
</style>
</head>
<body>
<header>
  <h1>aranya · scan graph</h1>
  <span class="meta" id="runmeta"></span>
  <span class="meta hint">edges = packet traversal · boxes = AS / same-machine containment · dashed hop = weaker ttl · click a hop, edge, handoff chip or AS box for detail &amp; source</span>
</header>
<div id="wrap">
  <div id="canvas"><svg id="svg"><g id="viewport"></g></svg></div>
  <aside id="panel"></aside>
</div>
<div id="tooltip"></div>
<script>
const DATA = /*__PATHS_DATA__*/;
const NS = "http://www.w3.org/2000/svg";
const W = 150, H = 30;
const AS_PALETTE = ["#16a34a","#0ea5e9","#a855f7","#f59e0b","#ef4444","#14b8a6","#84cc16","#e879f9"];
const hopById = {}; DATA.hops.forEach(h => hopById[h.id] = h);
const svg = document.getElementById("svg");
const viewport = document.getElementById("viewport");
const tooltip = document.getElementById("tooltip");
const panel = document.getElementById("panel");
const canvas = document.getElementById("canvas");
let scale = 1, tx = 0, ty = 0;

function el(name, attrs) { const n = document.createElementNS(NS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
function colorFor(asn) { let s = 0; for (const c of (asn||"")) s = (s*31 + c.charCodeAt(0))>>>0; return AS_PALETTE[s % AS_PALETTE.length]; }

function draw() {
  viewport.textContent = "";
  for (const c of DATA.containers) {
    const g = el("g", {class:"container"});
    if (c.kind === "as") {
      g.appendChild(el("rect", {class:"asbox", x:c.x, y:c.y, width:c.w, height:c.h, rx:10, stroke:colorFor(c.label)}));
      const t = el("text", {class:"boxtitle", x:c.x+8, y:c.y+14});
      const asName = c.info.name ? (c.info.name.length > 20 ? c.info.name.slice(0, 19) + "…" : c.info.name) : "";
      t.textContent = c.label + (asName ? "  " + asName : "");
      g.appendChild(t);
      const viaIx = c.info.ixps && c.info.ixps.length;
      if (viaIx) {
        const names = c.info.ixps.map(x => x.name).slice(0, 2);
        const more = c.info.ixps.length - names.length;
        const s = el("text", {class:"boxsub", x:c.x+8, y:c.y+26});
        s.textContent = "via " + names.join(", ") + (more > 0 ? ` +${more}` : "");
        g.appendChild(s);
      } else if (c.info.facilities && c.info.facilities.length) {
        const n = c.info.facilities.length;
        const first = c.info.facilities[0].name;
        const short = first.length > 20 ? first.slice(0, 19) + "…" : first;
        const s = el("text", {class:"boxsub", x:c.x+8, y:c.y+26});
        s.textContent = "near " + short + (n > 1 ? ` +${n-1}` : "");
        g.appendChild(s);
      }
      const hasHandoff = (c.info.ixps && c.info.ixps.length) || (c.info.facilities && c.info.facilities.length);
      g.addEventListener("mousemove", ev => tip(ev, "AS container · " + c.label + (hasHandoff ? " · suspected handoff" : "")));
      g.addEventListener("click", ev => { ev.stopPropagation(); showAs(c); });
    } else {
      g.appendChild(el("rect", {class:"machinebox", x:c.x, y:c.y, width:c.w, height:c.h, rx:8}));
      g.addEventListener("mousemove", ev => tip(ev, "same machine"));
    }
    g.addEventListener("mouseleave", hideTip);
    viewport.appendChild(g);
  }
  for (const e of DATA.edges) {
    const a = hopById[e.source], b = hopById[e.target];
    if (!a || !b) continue;
    const ax = a.x + W, ay = a.y + H/2, bx = b.x, by = b.y + H/2, mid = (ax+bx)/2;
    const d = Math.abs(a.x-b.x) < 1
      ? `M${ax},${ay} C${ax+26},${ay} ${bx+W+26},${by} ${bx+W},${by}`
      : `M${ax},${ay} C${mid},${ay} ${mid},${by} ${bx},${by}`;
    const g = el("g");
    const hand = e.handoff || {ixps:[], facilities:[]};
    g.appendChild(el("path", {class:"edge", d, stroke: (hand.ixps.length || hand.facilities.length) ? "#f59e0b" : "#60a5fa",
                              "stroke-width": 1.5 + Math.min(e.count,4),
                              "stroke-dasharray": e.gap ? "6 5" : "none", opacity:0.9}));
    g.appendChild(el("path", {class:"edge", d, stroke:"transparent", "stroke-width":14}));
    const handoffTip = hand.ixps.length ? " · suspected IXP " + hand.ixps.map(x=>x.name).join(", ")
      : (hand.facilities.length ? " · suspected facility " + hand.facilities.map(f=>f.name).join(", ") : "");
    g.addEventListener("mousemove", ev => tip(ev, `hop → hop · ttl ${e.ttl}${e.gap ? " · gap" : ""}${e.min_rtt_ms!=null ? " · "+e.min_rtt_ms.toFixed(1)+"ms" : ""}${handoffTip}`));
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("click", ev => { ev.stopPropagation(); showEdge(e); });
    viewport.appendChild(g);
    if (hand.ixps.length || hand.facilities.length) {
      const isIx = hand.ixps.length > 0;
      const list = isIx ? hand.ixps : hand.facilities;
      const label = isIx ? ("IX " + list[0].name + (list.length > 1 ? ` +${list.length-1}` : "")) : ("FAC ×" + list.length);
      const cx = Math.abs(a.x-b.x) < 1 ? Math.max(ax,bx)+40 : (ax+bx)/2;
      const cy = (a.y + b.y)/2 + H/2 - 16;
      const cg = el("g", {class:"ixchip"});
      const w = 12 + label.length * 6;
      cg.appendChild(el("rect", {x:cx-w/2, y:cy-9, width:w, height:16, fill: isIx ? "#0ea5e9" : "#b45309"}));
      const ct = el("text", {x:cx, y:cy+3, "text-anchor":"middle"}); ct.textContent = label; cg.appendChild(ct);
      cg.addEventListener("mousemove", ev => tip(ev, "suspected handoff · " + list.map(x=>x.name).join(", ")));
      cg.addEventListener("mouseleave", hideTip);
      cg.addEventListener("click", ev => { ev.stopPropagation(); showEdge(e); });
      viewport.appendChild(cg);
    }
  }
  for (const h of DATA.hops) {
    const g = el("g", {class:"hop", transform:`translate(${h.x},${h.y})`});
    const rect = el("rect", {width:W, height:H, fill:h.is_target ? "#f59e0b" : (h.as ? colorFor(h.as) : "#475569")});
    if (h.ttl_confidence && h.ttl_confidence !== "high") {
      rect.setAttribute("stroke", h.ttl_confidence === "low" ? "#ef4444" : "#f59e0b");
      rect.setAttribute("stroke-dasharray", h.ttl_confidence === "low" ? "3 2" : "5 3");
      rect.setAttribute("stroke-width", "2");
    }
    g.appendChild(rect);
    const t = el("text", {x:8, y:19});
    t.textContent = (h.ttl!=null ? h.ttl+"  " : "") + h.id;
    g.appendChild(t);
    if (h.ix) g.appendChild(el("circle", {class:"ixdot", cx:W-8, cy:8, r:4}));
    const hopTip = "hop · " + h.id + (h.as ? " · " + h.as : "") + (h.ix ? " · IXP " + h.ix.name : "")
      + (h.ttl_confidence && h.ttl_confidence !== "high" ? " · ttl " + h.ttl_confidence : "");
    g.addEventListener("mousemove", ev => tip(ev, hopTip));
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("click", ev => { ev.stopPropagation(); showHop(h); });
    viewport.appendChild(g);
  }
}

function tip(ev, text) { tooltip.textContent = text; tooltip.style.display="block";
  tooltip.style.left=(ev.clientX+12)+"px"; tooltip.style.top=(ev.clientY+12)+"px"; }
function hideTip() { tooltip.style.display="none"; }

function title(t) { const h=document.createElement("h2"); h.textContent=t; return h; }
function rows(entries) { const tb=document.createElement("table");
  for (const [k,v] of entries) { if (v==null||v==="") continue;
    const tr=document.createElement("tr"); const kd=document.createElement("td"); kd.className="k"; kd.textContent=k;
    const vd=document.createElement("td"); vd.textContent=String(v); tr.append(kd,vd); tb.appendChild(tr); } return tb; }
function link(url) { if(!url) return null; const a=document.createElement("a"); a.href=url; a.target="_blank";
  a.rel="noopener noreferrer"; a.textContent="source ↗"; return a; }
function item(text, url) { const d=document.createElement("div"); d.className="item"; d.textContent=text;
  const a=link(url); if(a){ d.appendChild(document.createElement("br")); d.appendChild(a);} return d; }

function showHop(h) {
  panel.textContent = "";
  panel.appendChild(title("HOP"));
  panel.appendChild(rows([["ip", h.id], ["ttl", h.ttl], ["as", h.as], ["as name", h.as_name],
                          ["aliased asns", (h.aliased_asns||[]).join(", ")], ["machine", h.machine],
                          ["location", h.geo ? [h.geo.city, h.geo.country].filter(Boolean).join(", ") + "  (" + h.geo.source + ")" : null],
                          ["at IXP", h.ix ? h.ix.name : null],
                          ["IXPs (AS)", h.total_ixps ? h.relevant_ixps.length + " suspected / " + h.total_ixps : null],
                          ["facilities (AS)", h.total_facilities ? h.relevant_facilities.length + " suspected / " + h.total_facilities : null]]));
  const a = link(h.source_url); if (a) panel.appendChild(a);
  panel.appendChild(title("TTL trust · " + (h.ttl_confidence || "unknown")));
  panel.appendChild(rows([["probe ttl", h.ttl], ["seen by flows", h.ttl_flows],
                          ["icmp reply ttl", h.ttl_reply], ["return hops", h.ttl_return_hops]]));
  for (const r of (h.ttl_reasons || [])) panel.appendChild(item(r, null));
  if (h.relevant_ixps && h.relevant_ixps.length) {
    panel.appendChild(title("suspected IXPs · shared with neighbour"));
    for (const x of h.relevant_ixps) panel.appendChild(item(x.name, x.source_url));
  }
  if (h.relevant_facilities && h.relevant_facilities.length) {
    panel.appendChild(title("suspected facilities"));
    for (const f of h.relevant_facilities) panel.appendChild(item(f.name + (f.city ? " · " + f.city : ""), f.source_url));
  }
}
function fmtPlace(p) { return p && (p.city || p.country) ? [p.city, p.country].filter(Boolean).join(", ") : "?"; }
function showEdge(e) {
  panel.textContent = "";
  panel.appendChild(title("TRAVERSAL EDGE"));
  panel.appendChild(rows([["from", e.source + (e.from_as ? "  " + e.from_as : "")],
                          ["to", e.target + (e.to_as ? "  " + e.to_as : "")],
                          ["ttl", e.ttl], ["flows", e.count], ["min_rtt_ms", e.min_rtt_ms],
                          ["gap", e.gap ? "yes" : "no"]]));
  const hand = e.handoff || {ixps:[], facilities:[], geo:null};
  if (hand.geo) {
    panel.appendChild(title("endpoint locations"));
    panel.appendChild(rows([["from", fmtPlace(hand.geo.a)], ["to", fmtPlace(hand.geo.b)],
                            ["match", hand.geo.match ? ("yes" + (hand.geo.distance_km!=null ? " · " + Math.round(hand.geo.distance_km) + " km" : "")) : "no"]]));
  }
  panel.appendChild(title("suspected handoff"));
  if (!hand.ixps.length && !hand.facilities.length) {
    const note = (e.from_as && e.to_as && e.from_as !== e.to_as)
      ? "no shared IXP / facility (PeeringDB)" : "intra-AS";
    panel.appendChild(rows([["", note]]));
  }
  for (const x of hand.ixps) panel.appendChild(item("IXP · " + x.name, x.source_url));
  for (const f of hand.facilities) panel.appendChild(item("facility · " + f.name + (f.city ? " · " + f.city : "") + (f.method ? "  [" + f.method + "]" : ""), f.source_url));
}
function showAs(c) {
  panel.textContent = "";
  panel.appendChild(title("AS CONTAINER · " + c.label + (c.info.name ? "  " + c.info.name : "")));
  const a = link(c.info.source_url); if (a) panel.appendChild(a);
  if (c.info.probe_count != null) {
    const countries = Object.entries(c.info.probe_countries || {}).map(([k, v]) => k + " " + v).join(", ");
    panel.appendChild(rows([["RIPE Atlas probes", c.info.probe_count + (countries ? "  (" + countries + ")" : "")]]));
  }
  const ixps = c.info.ixps || [], facs = c.info.facilities || [];
  panel.appendChild(title("suspected IXPs · " + ixps.length + " / " + c.info.total_ixps));
  if (!ixps.length) panel.appendChild(rows([["", "no shared IXP with scanned neighbours"]]));
  for (const x of ixps) panel.appendChild(item(x.name, x.source_url));
  panel.appendChild(title("suspected facilities · " + facs.length + " / " + c.info.total_facilities));
  if (!facs.length) panel.appendChild(rows([["", "no shared facility with scanned neighbours"]]));
  for (const f of facs) panel.appendChild(item(f.name + (f.city ? " · " + f.city : ""), f.source_url));
}

function summary() {
  panel.textContent = "";
  panel.appendChild(title("SCAN"));
  panel.appendChild(rows([["target", DATA.run.target], ["vantage", DATA.run.vantage],
                          ["tool", DATA.run.tool], ["hops", DATA.hops.length], ["edges", DATA.edges.length]]));
  const low = DATA.hops.filter(h => h.ttl_confidence === "low").length;
  const med = DATA.hops.filter(h => h.ttl_confidence === "medium").length;
  panel.appendChild(title("TTL trust"));
  panel.appendChild(rows([["source", "active traceroute · " + (DATA.run.tool || "?") + " · per-flow"],
                          ["high", DATA.hops.length - low - med], ["medium", med], ["low", low]]));
  panel.appendChild(item("ttl = probe ttl at which a hop answered; weakened by multi-flow ttl disagreement, single flow, or a preceding gap. Cross-check with RIPE Atlas / Globalping from other vantages.", null));
  panel.appendChild(title("BGP sessions · " + DATA.sessions.length));
  for (const s of DATA.sessions.slice(0, 40))
    panel.appendChild(item(`${s.speaker} → ${s.collector}  [${s.as_path}]`, s.source_url));
  panel.appendChild(title("facilities · " + DATA.facilities.length));
  for (const f of DATA.facilities) panel.appendChild(item(f.name, f.source_url));
  panel.appendChild(title("IXPs · " + DATA.ixps.length));
  for (const x of DATA.ixps) panel.appendChild(item(x.name, x.source_url));
}

function apply() { viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`); }
function bounds() { let mx=0,my=0;
  for (const h of DATA.hops) { mx=Math.max(mx,h.x+W); my=Math.max(my,h.y+H); }
  for (const c of DATA.containers) { mx=Math.max(mx,c.x+c.w); my=Math.max(my,c.y+c.h); }
  return {mx:mx+160, my:my+160}; }
function sizeSvg() { const b=bounds(); svg.setAttribute("width",b.mx); svg.setAttribute("height",b.my); }
function fit() { sizeSvg(); const b=bounds();
  scale=Math.min(canvas.clientWidth/b.mx, canvas.clientHeight/b.my, 1); tx=12; ty=12; apply(); }

canvas.addEventListener("mousedown", ev => {
  canvas.classList.add("grabbing");
  const sx=ev.clientX-tx, sy=ev.clientY-ty;
  const move=e2=>{tx=e2.clientX-sx; ty=e2.clientY-sy; apply();};
  const up=()=>{canvas.classList.remove("grabbing"); document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up);};
  document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
});
canvas.addEventListener("wheel", ev => { ev.preventDefault();
  scale=Math.max(0.25, Math.min(3, scale*(ev.deltaY<0?1.1:0.9))); apply(); }, {passive:false});

draw(); fit(); summary();
window.addEventListener("resize", () => { sizeSvg(); apply(); });
</script>
</body>
</html>
